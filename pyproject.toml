[project]
name = "nibe-service-usb"
version = "0.1.0"
description = "Gateway between Home Assistant and a Nibe heat pump service USB console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mikael Tuomisalo" }]
dependencies = [
    "pyserial-asyncio-fast>=0.14",
    "zeroconf>=0.132",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/tumik/nibe-service-usb"
Issues = "https://github.com/tumik/nibe-service-usb/issues"
"Home Assistant integration" = "https://github.com/tumik/ha-nibe-service-usb"

[project.scripts]
nibe-service-usb = "nibe_service_usb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nibe_service_usb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
