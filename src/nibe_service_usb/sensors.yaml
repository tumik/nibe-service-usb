    kind: binary
    tier: diagnostic

  - name: hw_addheat_state
    label: "Hot water additional heat state"
    register: 31003
    type: s16
    kind: number
    tier: diagnostic

  - name: prio_seconds
    label: "Priority time"
    register: 43026
    type: u16
    unit: "s"
    kind: duration
    tier: diagnostic
    device_class: duration

  - name: compressor_reason
    label: "Compressor reason"
    register: 43102
    type: s16
    kind: number
    tier: diagnostic

  - name: compressor_prerun
    label: "Compressor pre-run"
    register: 43409
    type: s16
    kind: number
    tier: diagnostic

  - name: relays_pca_base
    label: "Relays PCA Base"
    register: 43514
    type: u16
    kind: number
    tier: diagnostic
    description: "Bit field"

  - name: relays_aa1
    label: "Relays AA1"
    register: 43516
    type: u16
    kind: number
    tier: diagnostic
    description: "Bit field"

  - name: relays_flags
    label: "Relay flags"
    register: 43518
    type: u16
    kind: number
    tier: diagnostic
    description: "Bit field"

  - name: el_step_target
    label: "Electric addition step target"
    register: 43200
    type: u8
    kind: number
    tier: diagnostic

  - name: alarm_log_index
    label: "Alarm log index"
    register: 45119
    type: s16
    kind: number
    tier: diagnostic

  - name: pca_status_byte
    label: "PCA status byte"
    register: 32040
    type: u8
    kind: number
    tier: diagnostic

  - name: control_flow
    label: "Control flow temperature"
    register: 41788
    type: s16
    scale: 0.1
    unit: "°C"
    kind: temperature
    precision: 1
    tier: diagnostic
    device_class: temperature
    state_class: measurement

  - name: curve_outdoor
    label: "Heating curve outdoor temperature"
    register: 40185
    type: s16
    scale: 0.1
    unit: "°C"
    kind: temperature
    precision: 1
    tier: diagnostic
    device_class: temperature
    state_class: measurement

  - name: req_hw_comp
    label: "Requested: hot water compressor"
    register: 43201
    type: s16
    kind: number
    tier: diagnostic

  - name: req_heat_comp
    label: "Requested: heating compressor"
    register: 43203
    type: s16
    kind: number
    tier: diagnostic

  - name: req_heat_el
    label: "Requested: heating electric"
    register: 43204
    type: s16
    kind: number
    tier: diagnostic

  - name: aux1_selector
    label: "AUX 1 function selector"
    register: 47411
    type: s16
    kind: number
    tier: diagnostic

  - name: aux2_selector
    label: "AUX 2 function selector"
    register: 47410
    type: s16
    kind: number
    tier: diagnostic

  - name: aux1_raw
    label: "AUX 1 raw input"
    register: 32004
    type: s16
    kind: number
    tier: diagnostic

  - name: aux2_raw
    label: "AUX 2 raw input"
    register: 32005
