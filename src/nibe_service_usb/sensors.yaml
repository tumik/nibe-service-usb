# Alarm flag registers (0 = inactive, non-zero = active), 6 RI lines of 9.
# number = alarm/info number in the F1226 alarm table. Folded into `active_alarms`.
alarms:
  - {number: 1, register: 45005, title: "Sensor fault BT1"}
  - {number: 2, register: 45006, title: "Sensor fault BT2"}
  - {number: 3, register: 45208, title: "Sensor fault BT3"}
  - {number: 6, register: 45011, title: "Sensor fault BT6"}
  - {number: 10, register: 45204, title: "Sensor fault BT10"}
  - {number: 11, register: 45202, title: "Sensor fault BT11"}
  - {number: 12, register: 45206, title: "Sensor fault BT12"}
  - {number: 14, register: 45210, title: "Sensor fault BT14"}
  - {number: 25, register: 45051, title: "Sensor error BT25"}
  - {number: 40, register: 45217, title: "Compressor phase 1 missing"}
  - {number: 41, register: 45219, title: "Compressor phase 2 missing"}
  - {number: 42, register: 45221, title: "Compressor phase 3 missing"}
  - {number: 43, register: 45215, title: "Incorrect phase sequence"}
  - {number: 44, register: 45225, title: "Overheating soft start"}
  - {number: 45, register: 45223, title: "Phase fault"}
  - {number: 50, register: 45196, title: "High pressure alarm"}
  - {number: 51, register: 45198, title: "Low pressure alarm"}
  - {number: 52, register: 45025, title: "Temperature limiter alarm"}
  - {number: 53, register: 45045, title: "Level sensor brine"}
  - {number: 54, register: 45200, title: "Motor protection alarm"}
  - {number: 55, register: 45227, title: "Hot gas alarm"}
  - {number: 56, register: 45113, title: "Erroneous serial no"}
  - {number: 57, register: 45114, title: "Erroneous software"}
  - {number: 58, register: 40833, title: "Pressure switch alarm"}
  - {number: 60, register: 45235, title: "Low temperature outgoing brine"}
  - {number: 68, register: 40841, title: "Pressure switch alarm (stage 2)"}
  - {number: 71, register: 45028, title: "Communication fault PCA Base"}
  - {number: 72, register: 45337, title: "Communication fault PCA Motor Controller"}
  - {number: 107, register: 45100, title: "Sensor fault BT7"}
  - {number: 140, register: 45263, title: "Compressor phase 1 missing (info)"}
