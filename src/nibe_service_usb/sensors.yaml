    tier: diagnostic

  - name: block_flag_43153
    label: "Block flag 43153"
    register: 43153
    type: s16
    kind: number
    tier: diagnostic

  - name: block_flag_43161
    label: "Block flag 43161"
    register: 43161
    type: s16
    kind: number
    tier: diagnostic

  - name: block_flag_43483
    label: "Block flag 43483"
    register: 43483
    type: s16
    kind: number
